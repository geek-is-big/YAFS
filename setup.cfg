[flake8]
ignore =
max-line-length = 79
max-complexity = 11

[tool:pytest]
addopts = --doctest-glob="*.rst" -m "not benchmark and not full_matrix"
markers =
    fast_matrix: deterministic black-box subset for commit-time regression checks
    full_matrix: full deterministic 2x2x9 black-box regression matrix

[coverage:run]
branch = True
include = sim/*,docs/*,tests/*

[wheel]
universal = 1
